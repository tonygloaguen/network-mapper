name: One-shot Ruff format

on:
  push:
    branches:
      - fix/ruff-format

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/ruff-format

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply Ruff format
        run: ruff format network_mapper.py tests/test_subnet_selection.py

      - name: Commit formatted files
        run: |
          if git diff --quiet -- network_mapper.py tests/test_subnet_selection.py; then
            echo "No formatting changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add network_mapper.py tests/test_subnet_selection.py
          git commit -m "Apply Ruff formatting"
          git push
