name: One-shot Mypy YAML fix v3

on:
  push:
    branches:
      - fix/ruff-format

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/ruff-format

      - name: Patch YAML typing and dev stubs
        run: |
          python - <<'PY'
          from pathlib import Path

          network_mapper = Path("network_mapper.py")
          text = network_mapper.read_text(encoding="utf-8")
          current = """from pathlib import Path
          from typing import Any

          yaml_module: Any | None
          try:
              import yaml as yaml_module
          except ImportError:  # pragma: no cover - exercised only when optional dependency is absent
              yaml_module = None
          """
          replacement = """from pathlib import Path

          try:
              import yaml
          except ImportError:  # pragma: no cover - exercised only when optional dependency is absent
              yaml = None  # type: ignore[assignment]
          """
          if current not in text:
              raise SystemExit("Expected yaml_module block not found")
          text = text.replace(current, replacement, 1)
          text = text.replace("if yaml_module is None:", "if yaml is None:")
          text = text.replace("data = yaml_module.safe_load(", "data = yaml.safe_load(")
          network_mapper.write_text(text, encoding="utf-8")

          req = Path("requirements-dev.txt")
          lines = req.read_text(encoding="utf-8").splitlines()
          if "types-PyYAML" not in lines:
              lines.append("types-PyYAML")
              req.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- network_mapper.py requirements-dev.txt; then
            echo "No changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add network_mapper.py requirements-dev.txt
          git commit -m "Fix PyYAML typing for Mypy"
          git push
